name: CENTRE API CD


on:
  push:
    branches:
      - develop
    paths:
      - "centre-api/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev/test/prod)"
        required: true
        default: "dev"

defaults:
  run:
    shell: bash
    working-directory: ./centre-api

env:
  APP_NAME: "centre-api"
  TAG_NAME: "${{ github.event.inputs.environment || 'dev' }}" # If the environment type is manually selected, use the input value; otherwise, use 'dev' as default

jobs:
  api-cd:
    runs-on: ubuntu-24.04

    if: github.repository == 'bcgov/EPIC.centre'
    environment:
      name: "dev"

    steps:
      - uses: actions/checkout@v6

      # Pinned to the Gold cluster's server version, and checked before it is
      # given the SA token. Bump both values when the cluster upgrades.
      - name: Install OpenShift CLI
        env:
          OC_VERSION: "4.18.53"
          OC_SHA256: "93fa299b699430c40685aabb22783df30838f2b956f6a57698d890dccafe41aa"
        run: |
          curl -sfLO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/${OC_VERSION}/openshift-client-linux.tar.gz"
          echo "${OC_SHA256}  openshift-client-linux.tar.gz" | sha256sum -c -
          tar -xzf openshift-client-linux.tar.gz oc
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Login Openshift
        shell: bash
        run: |
          oc login --server=${{secrets.OPENSHIFT_LOGIN_REGISTRY}} --token=${{secrets.OPENSHIFT_SA_TOKEN}}

      - name: Login Docker
        run: |
          echo "${{ secrets.OPENSHIFT_SA_TOKEN }}" | 
          docker login ${{ secrets.OPENSHIFT_IMAGE_REGISTRY }} -u ${{ secrets.OPENSHIFT_SA_NAME}} --password-stdin

      - name: Build image
        run: |
          docker build . --file Dockerfile --tag image

      - name: Push image
        run: |
          IMAGE_ID=${{ secrets.OPENSHIFT_IMAGE_REGISTRY }}/"${{ secrets.OPENSHIFT_REPOSITORY}}-tools"/$APP_NAME
          docker tag image $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
          docker image tag $IMAGE_ID:latest $IMAGE_ID:$TAG_NAME
          docker push $IMAGE_ID:$TAG_NAME

      - name: Rollout
        shell: bash
        run: |
          oc rollout restart deployment/${{ env.APP_NAME }} -n ${{ secrets.OPENSHIFT_REPOSITORY }}-${{ env.TAG_NAME }}
