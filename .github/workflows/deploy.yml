name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (test/prod)"
        required: true
        default: "test"

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  deployment:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      # Pinned to the Gold cluster's server version, and checked before it is
      # given the SA token. Bump both values when the cluster upgrades.
      - name: Install OpenShift CLI
        env:
          OC_VERSION: "4.18.53"
          OC_SHA256: "93fa299b699430c40685aabb22783df30838f2b956f6a57698d890dccafe41aa"
        run: |
          curl -sfLO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/${OC_VERSION}/openshift-client-linux.tar.gz"
          echo "${OC_SHA256}  openshift-client-linux.tar.gz" | sha256sum -c -
          tar -xzf openshift-client-linux.tar.gz oc
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Login Openshift
        shell: bash
        run: |
          oc login --server=${{secrets.OPENSHIFT_LOGIN_REGISTRY}} --token=${{secrets.OPENSHIFT_SA_TOKEN}}

      - name: Tag Images and Rollout
        shell: bash
        run: |
          oc project ${{ secrets.OPENSHIFT_REPOSITORY }}-tools
          oc tag centre-api:latest centre-api:${{ github.event.inputs.environment }}
          oc tag centre-web:latest centre-web:${{ github.event.inputs.environment }}
          
          oc rollout restart deployment/centre-api -n ${{ secrets.OPENSHIFT_REPOSITORY }}-${{ github.event.inputs.environment }} 
          oc rollout restart deployment/centre-web -n ${{ secrets.OPENSHIFT_REPOSITORY }}-${{ github.event.inputs.environment }}
