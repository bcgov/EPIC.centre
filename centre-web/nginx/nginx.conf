# nginx.conf
worker_processes auto;
error_log  /var/log/nginx/error.log;

pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  default_type  application/octet-stream;
  server_tokens off;
  underscores_in_headers on;

  # Use a w3c standard log format
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;


  server {

    # Content Security Policy, built one directive per variable.
    # The same image is promoted from dev to test to prod, so each list names every
    # environment's origin. Keep these `set`s above the `if` blocks: a `return` stops
    # later `set`s, which would leave the policy empty on 405 responses.
    #
    # API
    set $csp_api "https://centre-api-c8b80a-dev.apps.gold.devops.gov.bc.ca https://centre-api-c8b80a-test.apps.gold.devops.gov.bc.ca https://centre-api-c8b80a-prod.apps.gold.devops.gov.bc.ca";
    # Keycloak: OIDC discovery, token and revocation calls, and the silent logout/renew iframes
    set $csp_keycloak "https://dev.loginproxy.gov.bc.ca https://test.loginproxy.gov.bc.ca https://loginproxy.gov.bc.ca";
    # EPIC.map, loaded over Module Federation (VITE_MAP_WIDGET_URL / VITE_MAP_API_URL)
    set $csp_map_widget "https://map-widget-c8b80a-dev.apps.gold.devops.gov.bc.ca https://map-widget-c8b80a-test.apps.gold.devops.gov.bc.ca https://map-widget-c8b80a-prod.apps.gold.devops.gov.bc.ca";
    set $csp_map_api "https://map-api-c8b80a-dev.apps.gold.devops.gov.bc.ca https://map-api-c8b80a-test.apps.gold.devops.gov.bc.ca https://map-api-c8b80a-prod.apps.gold.devops.gov.bc.ca";
    # Basemap style, sprites, tiles and imagery; BC layer catalogue, WMS and geocoder used by the map
    set $csp_map_data "https://www.arcgis.com https://tiles.arcgis.com https://server.arcgisonline.com https://openmaps.gov.bc.ca https://catalogue.data.gov.bc.ca https://geocoder.api.gov.bc.ca";
    # AI search location: reverse geocoding in LocationContext
    set $csp_geocoder "https://nominatim.openstreetmap.org";

    set $csp "default-src 'self'";
    set $csp "${csp}; script-src 'self' ${csp_map_widget}";
    # MUI/emotion and the map widget inject <style> tags without a nonce
    set $csp "${csp}; style-src 'self' 'unsafe-inline'";
    # BC Sans is embedded as a data: URI by epic.theme
    set $csp "${csp}; font-src 'self' data:";
    set $csp "${csp}; img-src 'self' data: blob: https://www.arcgis.com https://server.arcgisonline.com https://openmaps.gov.bc.ca";
    set $csp "${csp}; connect-src 'self' ${csp_api} ${csp_keycloak} ${csp_map_api} ${csp_map_widget} ${csp_map_data} ${csp_geocoder}";
    # maplibre runs its worker from a blob: URL
    set $csp "${csp}; worker-src 'self' blob:";
    set $csp "${csp}; frame-src 'self' ${csp_keycloak}";
    set $csp "${csp}; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # disable TRACE and OPTIONS methods
    if ($request_method = OPTIONS)
    {
      return 405;
    }
    if ($request_method = TRACE)
    {
      return 405;
    }

    # Security headers; `always` adds them to error responses too
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options SAMEORIGIN always;

    listen 8080;
    server_name _;

    index index.html;
    error_log /dev/stdout info;
    access_log /dev/stdout;

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
