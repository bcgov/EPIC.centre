replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/c8b80a-tools/centre-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"

resources:
  cpu:
    limit: 100m
    request: 75m
  memory:
    limit: 384Mi
    request: 256Mi

database:
  secret: centre-patroni
  service:
    name: centre-patroni
    port: 5432

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

auth:
  jwt:
    alg: RS256
    aud: epic-centre
    cacheEnabled: true
    issuer: https://dev.loginproxy.gov.bc.ca/auth/realms/eao-epic
    cacheTimeout: "300"
    wellKnownConfig: https://dev.loginproxy.gov.bc.ca/auth/realms/eao-epic/.well-known/openid-configuration
  keycloak:
    uri: https://dev.loginproxy.gov.bc.ca
    realm: eao-epic
    adminClientId:
    adminClientSecret:
python:
  pythonBuffered: 1
  connectTimeout: 60
cors:
  origin: "https://dev.centre.eao.gov.bc.ca,"

app:
  name: "EPIC Centre"

urls:
  intranetLaunch: https://dev.intranet.gov.bc.ca/eao
  epicCentreWeb: https://centre-web-c8b80a-dev.apps.gold.devops.gov.bc.ca
  epicPublicUserManagement: https://eagle-dev.apps.silver.devops.gov.bc.ca/admin/
  epicEngageUserManagement: https://dev.engage.eao.gov.bc.ca/usermanagement
  epicTrackUserManagement: https://eao-dev.apps.gold.devops.gov.bc.ca/admin/users
  epicSubmitUserManagement: https://dev.submit.eao.gov.bc.ca/users
  epicComplianceUserManagement: https://eao-dev.apps.gold.devops.gov.bc.ca/compliance/admin/staff
  epicEngageLaunch: https://dev.engage.eao.gov.bc.ca/
  epicSubmitLaunch: https://dev.submit.eao.gov.bc.ca/staff
  epicPublicLaunch: https://eagle-dev.apps.silver.devops.gov.bc.ca/admin
  epicTrackLaunch: https://eao-dev.apps.gold.devops.gov.bc.ca
  epicComplianceLaunch: https://eao-dev.apps.gold.devops.gov.bc.ca/compliance
  conditionRepositoryLaunch: https://dev.conditions.eao.gov.bc.ca/condition/projects

email:
  dstEmail: MarieAnik.2.Paradis@gov.bc.ca

apis:
  authApi: https://auth-api-c72cba-dev.apps.gold.devops.gov.bc.ca
  submitApi: "https://submit-api-c72cba-dev.apps.gold.devops.gov.bc.ca"

# Epic group names (Keycloak top-level group names)
epicGroups:
  compliance: COMPLIANCE
  conditionRepo: CONDITION-REPO
  submit: SUBMIT
  track: TRACK
  engage: ENGAGE
  centre: CENTRE
  public: PUBLIC

# Epic admin subgroup names (Keycloak group names)
epicAdminSubgroups:
  admin: ADMIN
  eaoManager: EAO_MANAGER
  instanceAdmin: INSTANCE_ADMIN
  superuser: SUPERUSER
  superUser: SUPER_USER

# Epic admin group paths (Group/Subgroup)
epicAdminGroupPaths:
  compliance: COMPLIANCE/SUPERUSER
  conditionRepo: CONDITION-REPO/ADMIN
  submit: SUBMIT/EAO_MANAGER
  track: TRACK/INSTANCE_ADMIN
  engage: ENGAGE/INSTANCE_ADMIN
  centre: CENTRE/SUPER_USER
  public: PUBLIC/ADMIN

# Epic app client names (Keycloak client IDs)
epicAppClients:
  conditionRepository: epic-condition
  epicCompliance: epic-compliance
  epicTrack: epictrack-web
  epicPublic: epic-public
  epicSubmit: epic-submit
  epicEngage: epic-engage
  epicCentre: epic-centre