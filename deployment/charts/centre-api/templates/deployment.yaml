            - name: EPIC_APP_CLIENT_EPIC_PUBLIC
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}
                  key: EPIC_APP_CLIENT_EPIC_PUBLIC
            - name: EPIC_APP_CLIENT_EPIC_SUBMIT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}
                  key: EPIC_APP_CLIENT_EPIC_SUBMIT
            - name: EPIC_APP_CLIENT_EPIC_ENGAGE
              valueFrom:
