                  name: {{ .Chart.Name }}
                  key: EPIC_COMPLIANCE_USER_MANAGEMENT_URL
            - name: EPIC_ENGAGE_LAUNCH_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}
                  key: EPIC_ENGAGE_LAUNCH_URL
            - name: EPIC_SUBMIT_LAUNCH_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}
                  key: EPIC_SUBMIT_LAUNCH_URL
            - name: EPIC_PUBLIC_LAUNCH_URL
              valueFrom:
